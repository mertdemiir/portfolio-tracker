name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build React app
        run: npm run build

      - name: Compile Electron
        run: npm run electron:compile

      - name: Package Electron app
        run: npx electron-builder --${{ matrix.platform }} --publish never

      - name: Upload Mac artifacts
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: release-mac
          path: |
            release/*-arm64.dmg
            release/*-x64.dmg
            !release/*.blockmap

      - name: Upload Windows artifacts
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: release-win
          path: |
            release/*.exe
            !release/*.blockmap

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | head -20

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body: |
            ## Download

            | Platform | File |
            |----------|------|
            | **Mac (Apple Silicon)** | `Portfolio-Tracker-*-arm64.dmg` |
            | **Mac (Intel)** | `Portfolio-Tracker-*-x64.dmg` |
            | **Windows** | `Portfolio-Tracker-Setup-*.exe` |

            > **Mac users:** Right-click the app and select "Open" the first time (the app is not code-signed).
