name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build React app
        run: npm run build

      - name: Compile Electron
        run: npm run electron:compile

      - name: Package Electron app
        run: npx electron-builder --${{ matrix.platform }} --publish never

      - name: Upload Mac installer
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: mac
          path: release/Portfolio-Tracker-Mac.dmg

      - name: Upload Windows installer
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: win
          path: release/Portfolio-Tracker-Windows.exe

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Portfolio-Tracker-Mac.dmg
            artifacts/Portfolio-Tracker-Windows.exe
          body: |
            ## Download

            **Mac** — `Portfolio-Tracker-Mac.dmg` (Intel + Apple Silicon)
            **Windows** — `Portfolio-Tracker-Windows.exe`

            > Mac users: Right-click the app and select "Open" the first time.
